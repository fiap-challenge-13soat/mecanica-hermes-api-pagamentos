name: Build and Tests CI

on:
  push:
    branches:
      - "main"
      - "feature/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar pacotes
        run: dotnet restore Mecanica.Hermes.Pagamento.sln

      - name: Build
        run: dotnet build Mecanica.Hermes.Pagamento.sln --configuration Release --no-restore

      - name: Verificar Docker
        run: |
          docker --version
          docker ps

      - name: Instalar dependências auxiliares
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH


      - name: Executar testes com cobertura
        run: |
          dotnet test Mecanica.Hermes.Pagamento.sln \
            -c Release \
            --no-restore \
            --settings coverlet.runsettings \
            --results-directory .temp/coverage \
            --logger:"console;verbosity=normal"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Listar arquivos de cobertura gerados
        run: find .temp/coverage -name "*.opencover.xml" -o -name "*.cobertura.xml"

      - name: Gerar relatório HTML + Sumário
        run: |
          reportgenerator \
            -reports:".temp/coverage/**/coverage.opencover.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;JsonSummary;TextSummary" \
            -assemblyfilters:"+Mecanica.Hermes.Api;+Mecanica.Hermes.Application;+Mecanica.Hermes.Domain;+Mecanica.Hermes.Infrastructure;-*Tests;-Mecanica.Hermes.TestUtils" \
            -classfilters:"-*Migrations*;-*Program" \
            -filefilters:"+**/src/**;-*.g.cs;-*Designer.cs;-*Migrations/*.cs;-**/tests/**" \
            -title:"Cobertura de Testes"

      - name: Publicar artefato de cobertura HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-html
          path: coverage-report
          if-no-files-found: error
          retention-days: 7

      - name: Verificar threshold de cobertura (>=80% line)
        shell: bash
        run: |
          if [ ! -f coverage-report/Summary.json ]; then
            echo "Summary.json não encontrado. Falhando." >&2
            exit 1
          fi
          LINE=$(jq -r '.summary.linecoverage // 0' coverage-report/Summary.json)
          BRANCH=$(jq -r '.summary.branchcoverage // 0' coverage-report/Summary.json)
          echo "Line Coverage: ${LINE}%"
          echo "Branch Coverage: ${BRANCH}%"
          THRESHOLD=80
          awk -v cov="$LINE" -v thr="$THRESHOLD" 'BEGIN { exit (cov+0 < thr) ? 1 : 0 }' || {
            echo "Cobertura ${LINE}% abaixo do threshold mínimo (${THRESHOLD}%)." >&2
            exit 1
          }
          echo "Cobertura mínima de linhas atendida (>= ${THRESHOLD}%)."
